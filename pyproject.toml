[project]
name = "faststrapy"
version = "0.1.0"
description = "A CLI tool to scaffold production-ready projects instantly — inspired by create-next-app, powered by Jinja2 templates and interactive prompts."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
]
