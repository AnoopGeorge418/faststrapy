[project]
name = "faststrapy"
version = "0.1.0"
description = "A CLI tool to scaffold production-ready projects instantly — inspired by create-next-app, powered by Jinja2 templates and interactive prompts."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "black>=26.5.1",
    "fastapi[all]>=0.141.1",
    "jinja2>=3.1.6",
    "poethepoet>=0.48.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
]
